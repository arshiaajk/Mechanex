<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MechanX | سفارش دستگاه رست قهوه</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#0d0d0d;--mute:#6b6b6b;--line:#e4e4e0;--yel:#ffc400;--red:#e0261b;--org:#ff7a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0b;--card:#161616;--ink:#f5f5f2;--mute:#a0a09a;--line:#2a2a2a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0b0b;--card:#161616;--ink:#f5f5f2;--mute:#a0a09a;--line:#2a2a2a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#000;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:3px solid var(--yel)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#000;z-index:30}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.logo{width:48px;height:48px;border-radius:50%;background:conic-gradient(from 0deg,#fff,#e0261b,#ff7a00,#000,#fff);animation:spin 6s linear infinite;border:2px solid #fff;overflow:hidden;position:relative}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:spin 6s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.brand b{font-size:24px;letter-spacing:1px;font-weight:800;direction:ltr}
.brand b i{color:var(--yel);font-style:normal}
.burger{background:none;border:0;cursor:pointer;display:grid;gap:6px;padding:8px}
.burger span{display:block;width:28px;height:3px;background:#fff;border-radius:2px}
.drawer{position:fixed;top:0;bottom:0;left:0;width:260px;background:#000;color:#fff;z-index:40;padding:80px 20px 20px;transform:translateX(-100%);transition:.25s}
.drawer.open{transform:none}
.drawer button{display:block;width:100%;text-align:right;background:none;border:0;border-bottom:1px solid #2a2a2a;color:#fff;font:inherit;font-size:17px;padding:14px 4px;cursor:pointer}
.drawer button:hover{color:var(--yel)}
.shade{position:fixed;inset:0;background:#0008;z-index:35;display:none}.shade.open{display:block}
main{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
.hero{background:#000;color:#fff;border-radius:18px;padding:40px 28px;margin-bottom:28px;position:relative;overflow:hidden;border-bottom:6px solid var(--red)}
.hero h1{margin:0 0 8px;font-size:clamp(24px,5vw,38px);font-weight:800}
.hero h1 em{color:var(--yel);font-style:normal}
.hero p{margin:0;color:#cfcfcf;max-width:520px}
h2{font-size:20px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;transition:.2s;display:flex;flex-direction:column;gap:8px}
.card:hover{transform:translateY(-4px);border-color:var(--yel);box-shadow:0 8px 24px #0002}
.card .art{background:var(--bg);border-radius:12px;padding:10px}
.card h3{margin:0}.tag{font-size:13px;color:var(--mute)}
.price{font-weight:800}.price small{color:var(--mute);font-weight:400}
.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:var(--org)}.btn.alt{background:var(--yel);color:#000}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media(max-width:760px){.detail{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.desc{border:2px dashed var(--line);border-radius:12px;padding:16px;color:var(--mute);margin:14px 0;min-height:90px}
.lbl{font-weight:600;margin:16px 0 8px;display:block}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid var(--line);cursor:pointer}
.sw.on{border-color:var(--yel);outline:2px solid var(--ink)}
select,input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.total{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.total b{font-size:22px;color:var(--red)}
.back{background:none;border:0;color:var(--mute);font:inherit;cursor:pointer;margin-bottom:14px}
.form{max-width:420px;display:grid;gap:12px}
.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
footer{text-align:center;color:var(--mute);font-size:13px;padding:20px}
</style>
</head>
<body>
<header>
  <div class="brand" onclick="go('home')">
    <div class="logo" id="logo"></div>
    <b>Mechan<i>X</i></b>
  </div>
  <button class="burger" aria-label="منو" onclick="menu(true)"><span></span><span></span><span></span></button>
</header>
<div class="shade" id="shade" onclick="menu(false)"></div>
<nav class="drawer" id="drawer">
  <button onclick="go('profile')">پروفایل</button>
  <button onclick="go('orders')">سفارش‌ها</button>
  <button onclick="go('signup')">ثبت‌نام در سایت</button>
</nav>
<main id="app"></main>
<footer>© MechanX — ساخت دستگاه‌های رست قهوه به سفارش شما</footer>

<script>
// لوگوی خودتان را اینجا بگذارید (آدرس تصویر یا data:URI)؛ خالی باشد فقط گرادیان متحرک نمایش داده می‌شود
const LOGO_URL = "";
if (LOGO_URL) document.getElementById('logo').innerHTML = '<img src="' + LOGO_URL + '" alt="MechanX">';

/* قیمت‌ها به تومان. مبنا: رستر ۱۵ کیلویی حدود ۳۶٬۰۰۰ دلار، رستر ۶ کیلویی حدود ۲۱٬۰۰۰ یورو (≈۲۳٬۰۰۰ دلار) و
   رستر ۲ کیلویی حدود ۶٬۵۰۰ دلار؛ دلار آزاد ≈ ۲۵۰٬۰۰۰ تومان. قبل از انتشار با هزینه واقعی ساخت خودتان جایگزین کنید. */
const PRODUCTS = {
  small:  {name:'دستگاه رست کوچک', cap:'۲ کیلوگرم در هر بچ', base:1650000000, scale:.55},
  medium: {name:'دستگاه رست متوسط', cap:'۶ کیلوگرم در هر بچ', base:5200000000, scale:.78},
  large:  {name:'دستگاه رست بزرگ', cap:'۱۵ کیلوگرم در هر بچ', base:9000000000, scale:1}
};
const TIMES = [
  {id:'t20', label:'زیر ۲۰ روز (ساخت فوری)', mult:1.30},
  {id:'t45', label:'زیر ۴۵ روز', mult:1.00},
  {id:'t60', label:'بالای ۲ ماه (اقتصادی)', mult:0.88}
];
const COLORS = [
  {n:'مشکی',c:'#111'},{n:'سفید',c:'#f4f4f4'},{n:'قرمز',c:'#e0261b'},{n:'زرد',c:'#ffc400'},{n:'نارنجی',c:'#ff7a00'}
];
let state = {user:null, orders:[]};
try{const s=localStorage.getItem('mx');if(s)state=JSON.parse(s)}catch(e){}
const save=()=>{try{localStorage.setItem('mx',JSON.stringify(state))}catch(e){}};
const fa = n => Number(n).toLocaleString('fa-IR');
const fmt = n => fa(Math.round(n/1e6)) + ' میلیون تومان';

function art(color, k=1){
  const c=color||'#111';
  return `<svg viewBox="0 0 220 170" width="100%" style="max-height:${220*k}px" aria-hidden="true">
  <ellipse cx="110" cy="158" rx="80" ry="7" fill="#0003"/>
  <rect x="55" y="70" width="95" height="75" rx="10" fill="${c}" stroke="#888" stroke-width="2"/>
  <path d="M65 70 L100 28 H125 L150 70Z" fill="${c}" stroke="#888" stroke-width="2"/>
  <circle cx="102" cy="108" r="22" fill="#222" stroke="#ffc400" stroke-width="4"/>
  <circle cx="102" cy="108" r="6" fill="#e0261b"/>
  <rect x="150" y="85" width="40" height="46" rx="6" fill="${c}" stroke="#888" stroke-width="2"/>
  <rect x="158" y="95" width="24" height="10" rx="2" fill="#ffc400"/>
  <rect x="62" y="145" width="12" height="10" fill="#555"/><rect x="132" y="145" width="12" height="10" fill="#555"/>
  </svg>`;
}

const app = document.getElementById('app');
function menu(o){document.getElementById('drawer').classList.toggle('open',o);document.getElementById('shade').classList.toggle('open',o)}
function go(v,a){menu(false);window.scrollTo(0,0);({home,product,orders,profile,signup})[v](a)}

function home(){
  app.innerHTML = `
  <section class="hero"><h1>دستگاه رست قهوه‌ات را <em>سفارش بده</em>، ما می‌سازیم</h1>
  <p>ظرفیت، رنگ و زمان تحویل را خودت انتخاب کن؛ قیمت لحظه‌ای تغییر می‌کند.</p></section>
  <h2>انتخاب دستگاه</h2>
  <div class="grid">${Object.entries(PRODUCTS).map(([k,p])=>`
    <div class="card" onclick="go('product','${k}')">
      <div class="art">${art('#111',p.scale)}</div>
      <h3>${p.name}</h3><span class="tag">${p.cap}</span>
      <span class="price"><small>شروع از</small> ${fmt(p.base*.88)}</span>
      <button class="btn alt">مشاهده و سفارش</button>
    </div>`).join('')}</div>`;
}

function product(k){
  const p=PRODUCTS[k]; let color=COLORS[0], time=TIMES[1];
  app.innerHTML = `
  <button class="back" onclick="go('home')">← بازگشت</button>
  <div class="detail">
    <div class="panel"><div id="pic">${art(color.c)}</div></div>
    <div class="panel">
      <h2>${p.name}</h2><span class="tag">${p.cap}</span>
      <div class="desc">توضیحات دستگاه اینجا قرار می‌گیرد…</div>
      <span class="lbl">رنگ: <span id="cn">${color.n}</span></span>
      <div class="swatches">${COLORS.map((c,i)=>`<div class="sw ${i?'':'on'}" style="background:${c.c}" title="${c.n}" data-i="${i}"></div>`).join('')}</div>
      <span class="lbl">زمان ساخت</span>
      <select id="tm">${TIMES.map((t,i)=>`<option value="${i}" ${i==1?'selected':''}>${t.label}</option>`).join('')}</select>
      <div class="total"><span>قیمت نهایی</span><b id="pr"></b></div>
      <button class="btn" style="width:100%;margin-top:14px" id="ord">ثبت سفارش</button>
    </div>
  </div>`;
  const upd=()=>{document.getElementById('pr').textContent=fmt(p.base*time.mult);
    document.getElementById('pic').innerHTML=art(color.c);document.getElementById('cn').textContent=color.n};
  upd();
  app.querySelectorAll('.sw').forEach(s=>s.onclick=()=>{app.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));
    s.classList.add('on');color=COLORS[s.dataset.i];upd()});
  document.getElementById('tm').onchange=e=>{time=TIMES[e.target.value];upd()};
  document.getElementById('ord').onclick=()=>{
    if(!state.user){alert('برای ثبت سفارش ابتدا ثبت‌نام کنید.');return go('signup')}
    state.orders.unshift({name:p.name,color:color.n,time:time.label,price:p.base*time.mult,date:new Date().toLocaleDateString('fa-IR')});
    save();go('orders')};
}

function orders(){
  app.innerHTML = `<h2>سفارش‌های من</h2><div class="panel">${state.orders.length?state.orders.map(o=>`
    <div class="row"><div><b>${o.name}</b><br><span class="tag">رنگ ${o.color} · ${o.time} · ${o.date}</span></div><b>${fmt(o.price)}</b></div>`).join(''):'<span class="tag">هنوز سفارشی ثبت نشده است.</span>'}</div>`;
}
function profile(){
  app.innerHTML = `<h2>پروفایل</h2><div class="panel">${state.user?`
    <div class="row"><span>نام</span><b>${state.user.name}</b></div>
    <div class="row"><span>شماره تماس</span><b>${state.user.phone}</b></div>
    <div class="row"><span>تعداد سفارش‌ها</span><b>${fa(state.orders.length)}</b></div>
    <button class="btn ghost" style="margin-top:14px" id="out">خروج</button>`:
    '<span class="tag">وارد نشده‌اید.</span><br><br><button class="btn" onclick="go(\'signup\')">ثبت‌نام</button>'}</div>`;
  const o=document.getElementById('out');if(o)o.onclick=()=>{state.user=null;save();go('home')};
}
function signup(){
  app.innerHTML = `<h2>ثبت‌نام در سایت</h2><div class="panel"><div class="form">
    <input id="n" placeholder="نام و نام خانوادگی"><input id="p" placeholder="شماره موبایل" inputmode="tel">
    <button class="btn" id="go">ثبت‌نام</button></div></div>`;
  document.getElementById('go').onclick=()=>{
    const name=document.getElementById('n').value.trim(),phone=document.getElementById('p').value.trim();
    if(!name||!phone)return alert('نام و شماره را وارد کنید.');
    state.user={name,phone};save();go('profile')};
}
home();
</script>
</body>
</html>
